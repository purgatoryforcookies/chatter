services:
  redis:
    image: redis
    ports:
      - '6379:6379'
  db:
    image: postgres:17
    ports:
      - 5432:5432
    env_file:
      - ./server/.env
    volumes:
        - postgres-data:/var/lib/postgresql/data
        - ./init.sql:/docker-entrypoint-initdb.d/init.sql


volumes:
    postgres-data: