services:
  redis:
    image: redis
    ports:
      - '6379:6379'
  db:
    image: postgres:17
    ports:
      - 5432:5432
    env_file:
      - ./server/.env
    volumes:
        - postgres-data:/var/lib/postgresql/data
        - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  server:
    image: chatter-server
    build:
      context: .
      dockerfile: ./server/Dockerfile.dev
    command: npm run dev
    env_file:
      - ./server/.env
    volumes:
      - ./server/:/app/server
      - binserver:/app/server/node_modules
    ports:
      - 3000:3000

  client:
    image: chatter-client
    build:
      context: .
      dockerfile: ./client/Dockerfile.dev
    command: npm run dev
    env_file:
      - ./client/.env
    volumes:
      - ./client/:/app/client
      - binclient:/app/client/node_modules

volumes:
    postgres-data:
    binclient:
    binserver: