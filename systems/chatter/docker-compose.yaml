services:
  chatter-redis:
    image: redis:7
    ports:
      - "${CHATTER_REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chatter-postgres:
    image: postgres:17
    ports:
      - "${CHATTER_DB_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${CHATTER_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${CHATTER_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${CHATTER_POSTGRES_DB:-postgres}
    volumes:
      - chatter-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  chatter:
    image: chatter
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      chatter-postgres:
        condition: service_healthy
      chatter-redis:
        condition: service_healthy
    ports:
      - "${CHATTER_SERVER_HOST_PORT:-3000}:3000"
    extra_hosts:
      - "auth.purgatoryforcookies.com:host-gateway"
    environment:
      POSTGRES_USER: ${CHATTER_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${CHATTER_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${CHATTER_POSTGRES_DB:-postgres}
      POSTGRES_PORT: 5432
      POSTGRES_HOST: chatter-postgres
      DEVELOPMENT: ${CHATTER_DEVELOPMENT:-false}
      SERVER_PORT: 3000
      AUTH_ISSUER_URI: ${CHATTER_AUTH_ISSUER_URI:-https://test.remote.com}
      AUTH_AUDIENCE: ${CHATTER_AUTH_AUDIENCE:-chat}
      JWT_SECRET: ${CHATTER_JWT_SECRET:-kissa}
      JWT_EXP: ${CHATTER_JWT_EXP:-3h}
      JWT_SECRET_REFRESH: ${CHATTER_JWT_SECRET_REFRESH:-koira}
      JWT_EXP_REFRESH: ${CHATTER_JWT_EXP_REFRESH:-7d}
      JWT_ISSUER: ${CHATTER_JWT_ISSUER:-https://local.purgatoryforcookies.com}
      REDIS_URL: chatter-redis
      CLIENT_PROXY: ${CHATTER_CLIENT_PROXY:-}
      AWS_EXECUTION_ENV: ${CHATTER_AWS_EXECUTION_ENV:-}
      DAO_DB_TLS_CERT: ${CHATTER_DAO_DB_TLS_CERT:-}
      REDISCLIENT_DB_TLS_CERT: ${CHATTER_REDISCLIENT_DB_TLS_CERT:-}
      OIDCPROVIDER_HTTP_TIMEOUT: ${CHATTER_OIDCPROVIDER_HTTP_TIMEOUT:-}

volumes:
  chatter-postgres-data:
